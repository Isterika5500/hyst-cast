[package]
name = "hyst-cast"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
crossbeam-channel = "0.5.17"
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
gstreamer = { version = "0.25.4", features = ["v1_22"] }
gstreamer-app = "0.25.2"
gstreamer-video = "0.25.4"
hex = "0.4.3"
parking_lot = "0.13.0"
proto = { version = "0.1.0", path = "../proto" }
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.14.0", default-features = false, features = ["tokio", "screencast"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Diagnostics_ToolHelp"] }

[build-dependencies]
embed-resource = "3.0.12"
