[workspace]
resolver = "3"
members = ["proto", "server", "client"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev.package."*"]
opt-level = 2

# Исправленный quinn-udp: на Windows опции ECN/PKTINFO/DONTFRAG необязательны (wine, старые Windows 10)
[patch.crates-io]
quinn-udp = { path = "vendor/quinn-udp" }
